<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Image</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">

      <img src="Spongebob.png" class="spongebob" id="spongebob" alt="Spongebob is saying Hiyaaa to his neighbor">

  </div>

  <script src="script.js"></script>

</html>
